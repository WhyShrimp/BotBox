<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Битва Ботов на Арене</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .arena-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        #arena {
            border-radius: 50%;
            background: radial-gradient(circle, #3a5a8f 0%, #2a4a6f 60%, #1a2a4f 100%);
            border: 10px solid #5ab0ff;
            box-shadow: 0 0 40px rgba(90, 176, 255, 0.7), inset 0 0 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        #arena::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 580px;
            height: 580px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
        
        #arena::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 2px dotted rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        canvas {
            border-radius: 50%;
        }

        .controls {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            min-width: 350px;
            max-height: 800px;
            overflow-y: auto;
        }

        .bot-config {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .bot-config h3 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 14px;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 60px;
            padding: 3px;
            border-radius: 5px;
            border: none;
            background: #2a4a7f;
            color: white;
            text-align: center;
        }

        select {
            padding: 5px;
            border-radius: 5px;
            border: none;
            background: #2a4a7f;
            color: white;
            cursor: pointer;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .bot-1 .health-fill {
            background: linear-gradient(90deg, #ff6b6b, #ff8888);
        }

        .bot-2 .health-fill {
            background: linear-gradient(90deg, #4ecdc4, #6ee7df);
        }

        .action-weights {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .action-weights h4 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #aaa;
        }

        .weight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-size: 11px;
        }

        .weight-row label {
            flex: 1;
        }

        .weight-row input {
            width: 50px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #startBtn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        #resetBtn {
            background: linear-gradient(135deg, #f44336, #da190b);
            color: white;
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }

        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .log-entry.bot1 {
            color: #ff8888;
        }

        .log-entry.bot2 {
            color: #6ee7df;
        }

        .log-entry.system {
            color: #ffd700;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .winner {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            font-weight: bold;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .tactic-presets {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .tactic-btn {
            flex: 1;
            min-width: 70px;
            padding: 5px 8px;
            font-size: 11px;
            background: #2a4a7f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tactic-btn:hover {
            background: #3a5a9f;
        }

        .tactic-btn.active {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <h1>🤖 Битва Ботов на Арене ⚔️</h1>
    
    <div class="game-container">
        <div class="arena-container">
            <canvas id="arena" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <div class="bot-config">
                <h3><span style="color: #ff8888;">●</span> Бот 1 (Красный)</h3>
                <div class="config-row">
                    <label>HP: <span id="hp1-val">100</span></div>
                    <input type="range" id="hp1" min="50" max="200" value="100">
                </div>
                <div class="config-row">
                    <label>Атака: <span id="atk1-val">15</span></div>
                    <input type="range" id="atk1" min="5" max="30" value="15">
                </div>
                <div class="config-row">
                    <label>Защита: <span id="def1-val">5</span></div>
                    <input type="range" id="def1" min="0" max="15" value="5">
                </div>
                <div class="config-row">
                    <label>Скорость: <span id="spd1-val">3</span></div>
                    <input type="range" id="spd1" min="1" max="6" value="3">
                </div>
                
                <div class="action-weights">
                    <h4>⚙️ Веса действий (сумма = 100%)</h4>
                    <div class="weight-row">
                        <label>Движение:</label>
                        <input type="number" id="w1-move" min="0" max="100" value="30">
                    </div>
                    <div class="weight-row">
                        <label>Атака:</label>
                        <input type="number" id="w1-attack" min="0" max="100" value="30">
                    </div>
                    <div class="weight-row">
                        <label>Защита:</label>
                        <input type="number" id="w1-block" min="0" max="100" value="20">
                    </div>
                    <div class="weight-row">
                        <label>Рывок:</label>
                        <input type="number" id="w1-dash" min="0" max="100" value="10">
                    </div>
                    <div class="weight-row">
                        <label>Сильная атака:</label>
                        <input type="number" id="w1-heavy" min="0" max="100" value="5">
                    </div>
                    <div class="weight-row">
                        <label>Контратака:</label>
                        <input type="number" id="w1-counter" min="0" max="100" value="5">
                    </div>
                    <div class="tactic-presets">
                        <button class="tactic-btn" data-bot="1" data-preset="balanced">Баланс</button>
                        <button class="tactic-btn" data-bot="1" data-preset="aggressive">Атака</button>
                        <button class="tactic-btn" data-bot="1" data-preset="defensive">Защита</button>
                        <button class="tactic-btn" data-bot="1" data-preset="random">Случай</button>
                    </div>
                </div>
                
                <div class="health-bar">
                    <div id="health1" class="health-fill" style="width: 100%;"></div>
                </div>
            </div>

            <div class="bot-config">
                <h3><span style="color: #6ee7df;">●</span> Бот 2 (Синий)</h3>
                <div class="config-row">
                    <label>HP: <span id="hp2-val">100</span></div>
                    <input type="range" id="hp2" min="50" max="200" value="100">
                </div>
                <div class="config-row">
                    <label>Атака: <span id="atk2-val">15</span></div>
                    <input type="range" id="atk2" min="5" max="30" value="15">
                </div>
                <div class="config-row">
                    <label>Защита: <span id="def2-val">5</span></div>
                    <input type="range" id="def2" min="0" max="15" value="5">
                </div>
                <div class="config-row">
                    <label>Скорость: <span id="spd2-val">3</span></div>
                    <input type="range" id="spd2" min="1" max="6" value="3">
                </div>
                
                <div class="action-weights">
                    <h4>⚙️ Веса действий (сумма = 100%)</h4>
                    <div class="weight-row">
                        <label>Движение:</label>
                        <input type="number" id="w2-move" min="0" max="100" value="30">
                    </div>
                    <div class="weight-row">
                        <label>Атака:</label>
                        <input type="number" id="w2-attack" min="0" max="100" value="30">
                    </div>
                    <div class="weight-row">
                        <label>Защита:</label>
                        <input type="number" id="w2-block" min="0" max="100" value="20">
                    </div>
                    <div class="weight-row">
                        <label>Рывок:</label>
                        <input type="number" id="w2-dash" min="0" max="100" value="10">
                    </div>
                    <div class="weight-row">
                        <label>Сильная атака:</label>
                        <input type="number" id="w2-heavy" min="0" max="100" value="5">
                    </div>
                    <div class="weight-row">
                        <label>Контратака:</label>
                        <input type="number" id="w2-counter" min="0" max="100" value="5">
                    </div>
                    <div class="tactic-presets">
                        <button class="tactic-btn" data-bot="2" data-preset="balanced">Баланс</button>
                        <button class="tactic-btn" data-bot="2" data-preset="aggressive">Атака</button>
                        <button class="tactic-btn" data-bot="2" data-preset="defensive">Защита</button>
                        <button class="tactic-btn" data-bot="2" data-preset="random">Случай</button>
                    </div>
                </div>
                
                <div class="health-bar">
                    <div id="health2" class="health-fill" style="width: 100%;"></div>
                </div>
            </div>

            <div class="buttons">
                <button id="startBtn">▶ Старт</button>
                <button id="resetBtn">🔄 Сброс</button>
            </div>

            <div id="status" class="status">Настройте ботов и нажмите Старт</div>

            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const ARENA_RADIUS = 300;
        const BOT_RADIUS = 25;
        const ACTIONS = {
            MOVE: 'move',
            ATTACK: 'attack',
            BLOCK: 'block',
            DASH: 'dash',
            HEAVY_ATTACK: 'heavy_attack',
            COUNTER: 'counter'
        };

        const TACTIC_PRESETS = {
            balanced: { move: 30, attack: 30, block: 20, dash: 10, heavy: 5, counter: 5 },
            aggressive: { move: 20, attack: 40, block: 10, dash: 15, heavy: 10, counter: 5 },
            defensive: { move: 25, attack: 20, block: 35, dash: 5, heavy: 5, counter: 10 },
            random: { move: 17, attack: 17, block: 17, dash: 17, heavy: 16, counter: 16 }
        };

        let gameRunning = false;
        let gameInterval = null;
        let bots = [];
        let animationFrame = null;

        const canvas = document.getElementById('arena');
        const ctx = canvas.getContext('2d');

        class Bot {
            constructor(id, config) {
                this.id = id;
                this.maxHp = config.hp;
                this.hp = config.hp;
                this.attack = config.attack;
                this.defense = config.defense;
                this.speed = config.speed;
                this.weights = config.weights;
                
                this.x = id === 1 ? -100 : 100;
                this.y = 0;
                
                this.isStunned = false;
                this.stunTurns = 0;
                this.isBlocking = false;
                this.isAttacking = false;
                this.currentAction = null;
                this.actionStartTime = 0;
                this.state = 'idle';
                this.facingAngle = id === 1 ? 0 : Math.PI;
            }

            getDistanceTo(other) {
                const dx = this.x - other.x;
                const dy = this.y - other.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            getDistanceToCenter() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }

            isOutOfBounds() {
                return this.getDistanceToCenter() > ARENA_RADIUS - BOT_RADIUS;
            }

            chooseAction(enemy) {
                if (this.isStunned) {
                    return ACTIONS.MOVE;
                }

                const hpPercent = this.hp / this.maxHp;
                let adjustedWeights = { ...this.weights };
                
                if (hpPercent < 0.3) {
                    adjustedWeights.block = Math.min(50, adjustedWeights.block + 15);
                    adjustedWeights.attack = Math.max(5, adjustedWeights.attack - 10);
                } else if (hpPercent > 0.7 && enemy.hp / enemy.maxHp < 0.5) {
                    adjustedWeights.attack = Math.min(50, adjustedWeights.attack + 15);
                    adjustedWeights.heavy = Math.min(20, adjustedWeights.heavy + 5);
                }

                const total = Object.values(adjustedWeights).reduce((a, b) => a + b, 0);
                const rand = Math.random() * total;
                let cumulative = 0;
                
                const actionMap = [
                    { action: ACTIONS.MOVE, weight: adjustedWeights.move },
                    { action: ACTIONS.ATTACK, weight: adjustedWeights.attack },
                    { action: ACTIONS.BLOCK, weight: adjustedWeights.block },
                    { action: ACTIONS.DASH, weight: adjustedWeights.dash },
                    { action: ACTIONS.HEAVY_ATTACK, weight: adjustedWeights.heavy },
                    { action: ACTIONS.COUNTER, weight: adjustedWeights.counter }
                ];
                
                for (const { action, weight } of actionMap) {
                    cumulative += weight;
                    if (rand <= cumulative) {
                        return action;
                    }
                }
                
                return ACTIONS.MOVE;
            }

            moveTowards(enemy) {
                const dx = enemy.x - this.x;
                const dy = enemy.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    this.facingAngle = Math.atan2(dy, dx);
                }
                this.state = 'moving';
            }

            moveAwayFrom(enemy) {
                const dx = this.x - enemy.x;
                const dy = this.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    this.facingAngle = Math.atan2(dy, dx);
                }
                this.state = 'moving';
            }

            executeAction(action, enemy) {
                this.currentAction = action;
                this.actionStartTime = Date.now();
                this.isBlocking = false;
                this.isAttacking = false;

                switch (action) {
                    case ACTIONS.MOVE:
                        const dist = this.getDistanceTo(enemy);
                        if (dist > 60) {
                            this.moveTowards(enemy);
                        } else {
                            if (dist < 40) {
                                this.moveAwayFrom(enemy);
                            } else {
                                this.state = 'idle';
                            }
                        }
                        break;
                    
                    case ACTIONS.ATTACK:
                        this.isAttacking = true;
                        this.state = 'attacking';
                        const distance = this.getDistanceTo(enemy);
                        if (distance < 70) {
                            const damage = Math.max(1, this.attack - enemy.defense);
                            enemy.takeDamage(damage, this);
                            const knockback = 10;
                            const dx = enemy.x - this.x;
                            const dy = enemy.y - this.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            enemy.x += (dx / dist) * knockback;
                            enemy.y += (dy / dist) * knockback;
                        }
                        setTimeout(() => { this.isAttacking = false; }, 200);
                        break;
                    
                    case ACTIONS.BLOCK:
                        this.isBlocking = true;
                        this.state = 'blocking';
                        break;
                    
                    case ACTIONS.DASH:
                        this.state = 'dashing';
                        const dashDist = 50;
                        const dx = enemy.x - this.x;
                        const dy = enemy.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        this.x += (dx / dist) * dashDist;
                        this.y += (dy / dist) * dashDist;
                        this.facingAngle = Math.atan2(dy, dx);
                        
                        const newDist = this.getDistanceTo(enemy);
                        if (newDist < 50) {
                            const damage = Math.max(1, Math.floor(this.attack * 0.7) - enemy.defense);
                            enemy.takeDamage(damage, this);
                            enemy.stun(2);
                            const knockback = 20;
                            enemy.x += (dx / dist) * knockback;
                            enemy.y += (dy / dist) * knockback;
                        }
                        break;
                    
                    case ACTIONS.HEAVY_ATTACK:
                        this.isAttacking = true;
                        this.state = 'heavy_attacking';
                        const heavyDist = this.getDistanceTo(enemy);
                        if (heavyDist < 80) {
                            const damage = Math.max(1, Math.floor(this.attack * 1.8) - enemy.defense);
                            if (enemy.isBlocking) {
                                const blockedDamage = Math.floor(damage * 0.3);
                                enemy.takeDamage(blockedDamage, this);
                            } else {
                                enemy.takeDamage(damage, this);
                                enemy.stun(3);
                                const knockback = 30;
                                const dx = enemy.x - this.x;
                                const dy = enemy.y - this.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                enemy.x += (dx / dist) * knockback;
                                enemy.y += (dy / dist) * knockback;
                            }
                        }
                        setTimeout(() => { this.isAttacking = false; }, 400);
                        break;
                    
                    case ACTIONS.COUNTER:
                        this.state = 'countering';
                        this.isBlocking = true;
                        break;
                }
            }

            takeCounterDamage(attacker) {
                if (this.currentAction === ACTIONS.COUNTER && attacker.currentAction === ACTIONS.ATTACK) {
                    const distance = this.getDistanceTo(attacker);
                    if (distance < 70) {
                        const counterDamage = Math.max(1, Math.floor(this.attack * 1.2) - attacker.defense);
                        attacker.takeDamage(counterDamage, this);
                        attacker.stun(2);
                    }
                }
            }

            takeDamage(amount, from) {
                if (this.isBlocking && this.currentAction !== ACTIONS.COUNTER) {
                    amount = Math.floor(amount * 0.3);
                }
                this.hp = Math.max(0, this.hp - amount);
            }

            stun(turns) {
                this.isStunned = true;
                this.stunTurns = turns;
                this.state = 'stunned';
            }

            updateStun() {
                if (this.isStunned) {
                    this.stunTurns--;
                    if (this.stunTurns <= 0) {
                        this.isStunned = false;
                        this.state = 'idle';
                    }
                }
            }
        }

        function drawBot(bot, opponent) {
            ctx.save();
            ctx.translate(300 + bot.x, 300 + bot.y);
            
            const dx = opponent.x - bot.x;
            const dy = opponent.y - bot.y;
            const angle = Math.atan2(dy, dx);
            ctx.rotate(angle);
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, BOT_RADIUS + 5, BOT_RADIUS, BOT_RADIUS * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = bot.id === 1 ? '#cc5555' : '#3dbdb5';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            
            let armAngle1 = -0.6;
            let armAngle2 = 0.6;
            let armLength = 20;
            let handSize = 7;
            
            if (bot.state === 'attacking') {
                const progress = (Date.now() - bot.actionStartTime) / 150;
                armAngle1 = 0.1;
                armAngle2 = -0.1;
                if (progress < 0.5) {
                    armLength = 20 + progress * 18;
                } else {
                    armLength = 38 - (progress - 0.5) * 18;
                }
            } else if (bot.state === 'heavy_attacking') {
                const progress = (Date.now() - bot.actionStartTime) / 300;
                armAngle1 = 0.3;
                armAngle2 = -0.1;
                if (progress < 0.4) {
                    armLength = 18 + progress * 25;
                } else {
                    armLength = 43 - (progress - 0.4) * 20;
                }
                handSize = 10;
            } else if (bot.state === 'blocking' || bot.state === 'countering') {
                armAngle1 = -1.3;
                armAngle2 = 1.3;
                armLength = 16;
            } else if (bot.state === 'dashing') {
                armAngle1 = -2.2;
                armAngle2 = 2.2;
                armLength = 18;
            } else if (bot.state === 'stunned') {
                armAngle1 = -2.5;
                armAngle2 = 2.5;
                armLength = 14;
                handSize = 5;
            }
            
            ctx.save();
            ctx.rotate(armAngle1);
            ctx.beginPath();
            ctx.moveTo(8, -5);
            ctx.lineTo(8 + armLength, -5);
            ctx.stroke();
            ctx.fillStyle = bot.id === 1 ? '#ff6b6b' : '#4ecdc4';
            ctx.beginPath();
            ctx.arc(8 + armLength, -5, handSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
            
            ctx.save();
            ctx.rotate(armAngle2);
            ctx.beginPath();
            ctx.moveTo(8, 5);
            ctx.lineTo(8 + armLength, 5);
            ctx.stroke();
            ctx.fillStyle = bot.id === 1 ? '#ff6b6b' : '#4ecdc4';
            ctx.beginPath();
            ctx.arc(8 + armLength, 5, handSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
            
            const gradient = ctx.createRadialGradient(-5, -5, 0, 0, 0, BOT_RADIUS);
            if (bot.id === 1) {
                gradient.addColorStop(0, '#ff8888');
                gradient.addColorStop(1, '#ee5a5a');
            } else {
                gradient.addColorStop(0, '#6ee7df');
                gradient.addColorStop(1, '#44a3aa');
            }
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, BOT_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(10, -7, 6, 7, 0, 0, Math.PI * 2);
            ctx.ellipse(10, 7, 6, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(13, -7, 3, 0, Math.PI * 2);
            ctx.arc(13, 7, 3, 0, Math.PI * 2);
            ctx.fill();
            
            if (bot.state === 'stunned') {
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 0; i < 3; i++) {
                    const stunAngle = (Date.now() / 150 + i * 2) % (Math.PI * 2);
                    const radius = 35 + Math.sin(Date.now() / 100) * 5;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(stunAngle) * radius, Math.sin(stunAngle) * radius);
                    ctx.lineTo(Math.cos(stunAngle + 0.5) * (radius + 10), Math.sin(stunAngle + 0.5) * (radius + 10));
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }
            
            if (bot.state === 'blocking' || bot.state === 'countering') {
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.7)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, BOT_RADIUS + 8, -Math.PI/3, Math.PI/3);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            bots.forEach(bot => {
                const opponent = bots.find(b => b.id !== bot.id);
                drawBot(bot, opponent);
            });
        }

        function renderLoop() {
            if (gameRunning) {
                drawArena();
            }
            animationFrame = requestAnimationFrame(renderLoop);
        }

        function log(message, type = 'system') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            log.insertBefore(entry, log.firstChild);
        }

        function logBot(botId, message) {
            log(`Бот ${botId}: ${message}`, `bot${botId}`);
        }

        function logSystem(message) {
            log(`⚡ ${message}`, 'system');
        }

        function updateHealthBar(bot) {
            const healthBar = document.getElementById(`health${bot.id}`);
            const percent = (bot.hp / bot.maxHp) * 100;
            healthBar.style.width = Math.max(0, percent) + '%';
        }

        function gameLoop() {
            if (!gameRunning) return;

            const bot1 = bots[0];
            const bot2 = bots[1];

            if (bot1.hp <= 0 || bot2.hp <= 0) {
                endGame(bot1.hp <= 0 ? bot2 : bot1, 'HP истощено');
                return;
            }

            if (bot1.isOutOfBounds()) {
                endGame(bot2, 'Вытолкнут за арену');
                return;
            }

            if (bot2.isOutOfBounds()) {
                endGame(bot1, 'Вытолкнут за арену');
                return;
            }

            bot1.updateStun();
            bot2.updateStun();

            const action1 = bot1.chooseAction(bot2);
            const action2 = bot2.chooseAction(bot1);

            const actionNames = {
                'move': 'движение',
                'attack': 'атака',
                'block': 'защита',
                'dash': 'рывок',
                'heavy_attack': 'сильная атака',
                'counter': 'контратака'
            };
            logBot(1, actionNames[action1]);
            logBot(2, actionNames[action2]);

            bot1.executeAction(action1, bot2);
            bot2.executeAction(action2, bot1);

            bot2.takeCounterDamage(bot1);
            bot1.takeCounterDamage(bot2);

            updateHealthBar(bot1);
            updateHealthBar(bot2);
        }

        function endGame(winner, reason) {
            gameRunning = false;
            clearInterval(gameInterval);
            
            const status = document.getElementById('status');
            status.innerHTML = `🏆 Бот ${winner.id} победил! (${reason})`;
            status.classList.add('winner');
            
            logSystem(`=== БОТ ${winner.id} ПОБЕДИЛ! (${reason}) ===`);
            
            document.getElementById('startBtn').disabled = false;
        }

        function applyTacticPreset(botId, preset) {
            const weights = TACTIC_PRESETS[preset];
            document.getElementById(`w${botId}-move`).value = weights.move;
            document.getElementById(`w${botId}-attack`).value = weights.attack;
            document.getElementById(`w${botId}-block`).value = weights.block;
            document.getElementById(`w${botId}-dash`).value = weights.dash;
            document.getElementById(`w${botId}-heavy`).value = weights.heavy;
            document.getElementById(`w${botId}-counter`).value = weights.counter;
            
            document.querySelectorAll(`.tactic-btn[data-bot="${botId}"]`).forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.tactic-btn[data-bot="${botId}"][data-preset="${preset}"]`).classList.add('active');
        }

        function getActionWeights(botId) {
            return {
                move: parseInt(document.getElementById(`w${botId}-move`).value) || 0,
                attack: parseInt(document.getElementById(`w${botId}-attack`).value) || 0,
                block: parseInt(document.getElementById(`w${botId}-block`).value) || 0,
                dash: parseInt(document.getElementById(`w${botId}-dash`).value) || 0,
                heavy: parseInt(document.getElementById(`w${botId}-heavy`).value) || 0,
                counter: parseInt(document.getElementById(`w${botId}-counter`).value) || 0
            };
        }

        function startGame() {
            if (gameRunning) return;

            const config1 = {
                hp: parseInt(document.getElementById('hp1').value),
                attack: parseInt(document.getElementById('atk1').value),
                defense: parseInt(document.getElementById('def1').value),
                speed: parseInt(document.getElementById('spd1').value),
                weights: getActionWeights(1)
            };

            const config2 = {
                hp: parseInt(document.getElementById('hp2').value),
                attack: parseInt(document.getElementById('atk2').value),
                defense: parseInt(document.getElementById('def2').value),
                speed: parseInt(document.getElementById('spd2').value),
                weights: getActionWeights(2)
            };

            bots = [
                new Bot(1, config1),
                new Bot(2, config2)
            ];

            document.getElementById('status').textContent = 'Бой начался!';
            document.getElementById('status').classList.remove('winner');
            document.getElementById('log').innerHTML = '';
            document.getElementById('startBtn').disabled = true;

            logSystem('=== БОЙ НАЧАЛСЯ! ===');
            logSystem(`Бот 1: HP=${config1.hp}, ATK=${config1.attack}, DEF=${config1.defense}, SPD=${config1.speed}`);
            logSystem(`Бот 2: HP=${config2.hp}, ATK=${config2.attack}, DEF=${config2.defense}, SPD=${config2.speed}`);

            updateHealthBar(bots[0]);
            updateHealthBar(bots[1]);

            gameRunning = true;
            gameInterval = setInterval(gameLoop, 800);
        }

        function resetGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
            
            document.getElementById('status').textContent = 'Настройте ботов и нажмите Старт';
            document.getElementById('status').classList.remove('winner');
            document.getElementById('log').innerHTML = '';
            document.getElementById('startBtn').disabled = false;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            bots = [];
            drawArena();
        }

        function setupSliders() {
            ['hp', 'atk', 'def', 'spd'].forEach(stat => {
                [1, 2].forEach(botId => {
                    const slider = document.getElementById(`${stat}${botId}`);
                    const display = document.getElementById(`${stat}${botId}-val`);
                    slider.addEventListener('input', () => {
                        display.textContent = slider.value;
                    });
                });
            });
        }

        function init() {
            setupSliders();
            
            document.querySelectorAll('.tactic-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const botId = btn.dataset.bot;
                    const preset = btn.dataset.preset;
                    applyTacticPreset(botId, preset);
                });
            });

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('resetBtn').addEventListener('click', resetGame);

            applyTacticPreset(1, 'balanced');
            applyTacticPreset(2, 'balanced');
            
            renderLoop();
            
            setTimeout(() => {
                bots = [
                    new Bot(1, { hp: 100, attack: 15, defense: 5, speed: 3, weights: TACTIC_PRESETS.balanced }),
                    new Bot(2, { hp: 100, attack: 15, defense: 5, speed: 3, weights: TACTIC_PRESETS.balanced })
                ];
                drawArena();
            }, 100);
        }

        init();
    </script>
</body>
</html>
